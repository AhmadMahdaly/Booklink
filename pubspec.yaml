name: biblio
description: "Platform for exchanging and selling books."
version: 1.0.8+9

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  very_good_analysis: ^7.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.16
  shared_preferences: ^2.3.5
  icons_launcher: ^3.0.0
  easy_localization: ^3.0.7
  flutter_verification_code: ^1.1.7
  modal_progress_hud_nsn: ^0.5.1
  flutter_spinkit: ^5.2.1
  animate_do: ^4.1.1
  mobkit_dashed_border: ^0.0.7
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  animated_text_kit: ^4.2.2
  supabase_flutter: ^2.8.3
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  connectivity_plus: ^5.0.2
  flutter_bloc: ^9.1.0
  http: ^1.3.0
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.2
  google_mlkit_text_recognition: ^0.14.0
  firebase_core: ^3.12.1
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4


  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/translations/
    - assets/svg/
    - assets/icons/
    - .env
    - shorebird.yaml

  fonts:
    - family: Avenir Arabic
      fonts:
        - asset: assets/fonts/Avenir-Regular.otf
        - asset: assets/fonts/Avenir-Medium.otf
          weight: 700

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 200
  
icons_launcher:
  image_path: "assets/icons/icon app.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
# dart run icons_launcher:create